<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210">
  <rect width="1400" height="1210" fill="#0d1117"/>
  <rect x="35" y="30" width="1330" height="1150" rx="18" fill="#161b22" stroke="#30363d"/>
  <circle cx="75" cy="67" r="10" fill="#ff5f57"/><circle cx="105" cy="67" r="10" fill="#febc2e"/><circle cx="135" cy="67" r="10" fill="#28c840"/>
  <text x="175" y="74" fill="#8b949e" font-family="Menlo, Monaco, monospace" font-size="22">Terminal — Password Security Tool demonstration</text>
  <text x="75" y="140" fill="#f0f6fc" font-family="Menlo, Monaco, monospace" font-size="23">
    <tspan x="75" dy="0">Predictable sequence</tspan>
    <tspan x="75" dy="43">Assessment: </tspan><tspan fill="#ff7b72">Very Weak (2/10)</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Why:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It has at least 8 characters, but a longer passphrase is safer.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It uses 3 of 4 character types.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It contains a predictable keyboard or number sequence.</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Recommendations:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- Use at least 12 characters; 16 or more is even better.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- Add symbols.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- Avoid sequences such as '1234' and 'qwerty'.</tspan>
    <tspan x="75" dy="70" fill="#f0f6fc">Longer mixed example</tspan>
    <tspan x="75" dy="43" fill="#f0f6fc">Assessment: </tspan><tspan fill="#3fb950">Strong (8/10)</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Why:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It has 16 or more characters.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It uses 4 of 4 character types.</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Recommendations:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- Keep it unique for every account and store it in a password manager.</tspan>
    <tspan x="75" dy="70" fill="#f0f6fc">Passphrase-style example</tspan>
    <tspan x="75" dy="43" fill="#f0f6fc">Assessment: </tspan><tspan fill="#3fb950">Very Strong (9/10)</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Why:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It has 20 or more characters.</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- It uses 4 of 4 character types.</tspan>
    <tspan x="75" dy="43" fill="#c9d1d9">Recommendations:</tspan>
    <tspan x="75" dy="35" fill="#c9d1d9">- Keep it unique for every account and store it in a password manager.</tspan>
  </text>
</svg>
